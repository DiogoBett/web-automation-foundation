name: Run Automated Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment
        required: true
        type: choice
        options:
          - dev
          - preprod
          - prod
        default: dev

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Environment
        uses: actions/setup-node@v7
        with:
          node-version: '26.13.1'
          cache: npm

      - name: Dependencies
        run: |
          echo "Installing Dependencies..."
          npm install

      - name: Run Automated Tests
        env:
          SELECTED_ENVIRONMENT: ${{ inputs.environment || 'dev' }}
        run: npm run "cy:run:${SELECTED_ENVIRONMENT}"

      - name: Test Report
        uses: actions/upload-artifact@v7
        with:
          name: test_report
          path: |
            cucumber-report.html  
            cypress/screenshots/
            results/
          retention-days: 7
          overwrite: true
